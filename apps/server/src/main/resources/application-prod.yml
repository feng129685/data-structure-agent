spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  security:
    jwt-secret: ${JWT_SECRET}
    cookie-secure: true
  auth:
    expose-development-code: false
    mail-enabled: true
  knowledge:
    auto-publish-local: ${KNOWLEDGE_AUTO_PUBLISH_LOCAL:false}
  compiler:
    piston-base-url: ${PISTON_BASE_URL}

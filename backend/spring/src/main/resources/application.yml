server:
  port: ${SERVER_PORT:8792}
  forward-headers-strategy: framework

spring:
  application:
    name: ds-agent-server
  datasource:
    url: ${DB_URL:jdbc:h2:mem:dsagent;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.ssl.enable: ${SMTP_SSL:false}
      mail.smtp.ssl.checkserveridentity: ${SMTP_SSL_CHECK_SERVER_IDENTITY:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS_REQUIRED:${SMTP_STARTTLS:false}}
      mail.smtp.connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${SMTP_READ_TIMEOUT_MS:10000}
      mail.smtp.writetimeout: ${SMTP_WRITE_TIMEOUT_MS:10000}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

management:
  health:
    mail:
      enabled: ${AUTH_MAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  security:
    jwt-secret: ${JWT_SECRET}
    token-ttl: ${AUTH_TOKEN_TTL:PT2H}
    issuer: ${AUTH_TOKEN_ISSUER:ds-agent}
    cookie-name: ${AUTH_COOKIE_NAME:ds_session}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    teacher-emails: ${TEACHER_EMAILS:}
    node-compat-enabled: ${NODE_COMPAT_ENABLED:false}
    node-compat-jwt-secret: ${NODE_COMPAT_JWT_SECRET:}
  auth:
    verification-ttl: ${AUTH_CODE_TTL:PT10M}
    maximum-code-attempts: ${AUTH_CODE_MAX_ATTEMPTS:5}
    expose-development-code: ${AUTH_EXPOSE_DEV_CODE:false}
    mail-enabled: ${AUTH_MAIL_ENABLED:false}
    mail-from: ${SMTP_FROM:no-reply@example.com}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_PROVISION_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_PROVISION_EMAIL:}
    username: ${BOOTSTRAP_ADMIN_PROVISION_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PROVISION_PASSWORD:}
  model:
    provider: ${MODEL_PROVIDER:}
    api-key: ${MODEL_API_KEY:}
    base-url: ${MODEL_BASE_URL:}
    name: ${MODEL_NAME:}
    timeout: ${MODEL_TIMEOUT:PT45S}
    stream-idle-timeout: ${MODEL_STREAM_IDLE_TIMEOUT:PT30S}
    maximum-response-bytes: ${MODEL_MAX_RESPONSE_BYTES:1048576}
  ai-quota:
    daily-token-quota: ${AI_DAILY_TOKEN_QUOTA:0}
    maximum-concurrent-requests: ${AI_MAX_CONCURRENT_REQUESTS:1}
    reservation-ttl: ${AI_QUOTA_RESERVATION_TTL:PT2M}
  knowledge:
    enabled: ${KNOWLEDGE_ENABLED:true}
    auto-publish-local: ${KNOWLEDGE_AUTO_PUBLISH_LOCAL:false}
    directory: ${KNOWLEDGE_DIR:../../private/knowledge}
    minimum-score: ${KNOWLEDGE_MIN_SCORE:8}
    search-limit: ${KNOWLEDGE_SEARCH_LIMIT:4}
    chunk-size: ${KNOWLEDGE_CHUNK_SIZE:1100}
  resources:
    directory: ${RESOURCE_DIR:../../private/course-content}
  animation:
    maximum-concurrent-simulations: ${ANIMATION_MAX_CONCURRENT:4}
  compiler:
    piston-base-url: ${PISTON_BASE_URL:}
    timeout: ${EXECUTE_TIMEOUT:PT15S}
    maximum-code-length: ${EXECUTE_CODE_MAX_LENGTH:20000}
    maximum-input-length: ${EXECUTE_INPUT_MAX_LENGTH:12000}
    maximum-output-length: ${EXECUTE_OUTPUT_MAX_LENGTH:6000}
    maximum-concurrent-executions: ${EXECUTE_MAX_CONCURRENT:4}
    maximum-concurrent-executions-per-client: ${EXECUTE_MAX_CONCURRENT_PER_CLIENT:1}
    compile-timeout-millis: ${EXECUTE_COMPILE_TIMEOUT_MS:10000}
    run-timeout-millis: ${EXECUTE_RUN_TIMEOUT_MS:3000}

logging:
  level:
    root: INFO
    com.feng.dsagent: INFO

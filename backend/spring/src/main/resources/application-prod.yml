server:
  # Direct host deployments stay private by default. The production Compose
  # file overrides this to 0.0.0.0 inside an isolated container network.
  address: ${SERVER_ADDRESS:127.0.0.1}
  shutdown: graceful
  tomcat:
    threads:
      max: ${SERVER_MAX_THREADS:32}
      min-spare: ${SERVER_MIN_SPARE_THREADS:4}
    max-connections: ${SERVER_MAX_CONNECTIONS:128}

spring:
  lifecycle:
    timeout-per-shutdown-phase: ${SERVER_SHUTDOWN_TIMEOUT:30s}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:3000}
      maximum-pool-size: ${DB_MAX_POOL_SIZE:4}
      minimum-idle: ${DB_MIN_IDLE:1}
  flyway:
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: false

management:
  endpoint:
    health:
      show-details: never

app:
  security:
    jwt-secret: ${JWT_SECRET}
    token-ttl: ${AUTH_TOKEN_TTL:PT2H}
    issuer: ${AUTH_TOKEN_ISSUER:structify.cn}
    cookie-name: ${AUTH_COOKIE_NAME:ds_session}
    cookie-secure: true
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:https://structify.cn,https://admin.structify.cn}
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    teacher-emails: ${TEACHER_EMAILS:}
    node-compat-enabled: ${NODE_COMPAT_ENABLED:false}
    node-compat-jwt-secret: ${NODE_COMPAT_JWT_SECRET:}
  auth:
    expose-development-code: false
    mail-enabled: ${AUTH_MAIL_ENABLED:false}
  knowledge:
    auto-publish-local: false
  compiler:
    piston-base-url: ${PISTON_BASE_URL}

logging:
  level:
    root: INFO
    com.feng.dsagent: INFO

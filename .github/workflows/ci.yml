name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  prototype:
    name: Legacy prototype regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/verify-api-contract-fixtures.js
      - run: node scripts/verify-backend-layout.js
      - run: node scripts/verify-frontend-layout.js
      - run: node scripts/verify-core-regression.js
      - run: git diff --check

  frontend:
    name: Frontend tests, types, and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run Vitest
        working-directory: frontend
        run: npm test
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
      - name: Verify production artifact integrity
        run: node scripts/verify-frontend-build-artifact.js

  spring-backend:
    name: Spring backend tests and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Make Maven wrapper executable
        working-directory: backend/spring
        run: chmod +x mvnw
      - name: Run tests
        working-directory: backend/spring
        run: ./mvnw -B clean test
      - name: Package application
        working-directory: backend/spring
        run: ./mvnw -B -DskipTests package

  node-image:
    name: Node image build gate
    needs: [frontend, prototype]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Node compatibility image
        run: docker build --file deployment/Dockerfile.node --tag ds-agent-node:ci .
